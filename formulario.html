<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario</title>

    <center><h1>Formulário de Cadastro</h1>


    <label for="nome">* Nome:</label>
    <input type="text" id="nome" name="nome" placeholder="Digite seu nome completo"required><br><br>
    <label for="email">* Email:</label>
    <input type="email" id="email" name="email" placeholder="Digite seu melhor email" required><br><br>  
    <label for="celular">* Celular:</label>
    <input type="text" id="celular" name="celular" placeholder="(xx) xxxxx-xxxx" required><br><br>
    <label for="telefone">Telefone:</label>
    <input type="text" id="telefone" name="telefone" placeholder="(xx) xxxxx-xxxx"><br><br>
    <label for="data">* Data de nascimento:</label>
    <input type="date" id="data" name="data" required><br><br>
    <label for="sexo">* Sexo:</label>
    <select id="sexo" name="sexo" required>
        <option value="" disabled selected>Selecione</option>
        <option value="Masculino">masculino</option>
        <option value="Feminino">feminino</option>
        <option value="Outro">outro</option>
    </select><br><br>
    <label for="CEP">* CEP:</label>
    <input type="number" id="CEP" name="CEP" required><br><br>
    <label for="endereco">* Endereço:</label>
    <input type="text" id="endereco" name="endereco" required><br><br>
    <label for="numero">* Número:</label>
    <input type="text" id="numero" name="numero" required><br><br>
    <label for="complemento">Complemento:</label>
    <input type="text" id="complemento" name="complemento"><br><br>
    <label for="bairro">* Bairro:</label>
    <input type="text" id="bairro" name="bairro" required><br><br>
    <label for="cidade">* Cidade:</label>
    <input type="text" id="cidade" name="cidade" required><br><br>
    <label for="estado">* Estado:</label>
    <select id="estado" name="estado" required>
        <option value="" disabled selected>Selecione</option>
        <option value="AC">Acre</option>
        <option value="AL">Alagoas</option>
        <option value="AP">Amapá</option>
        <option value="AM">Amazonas</option>
        <option value="BA">Bahia</option>
        <option value="CE">Ceará</option>
        <option value="DF">Distrito Federal</option>
        <option value="ES">Espírito Santo</option>
        <option value="GO">Goiás</option>
        <option value="MA">Maranhão</option>
        <option value="MT">Mato Grosso</option>
        <option value="MS">Mato Grosso do Sul</option>
        <option value="MG">Minas Gerais</option>
        <option value="PA">Pará</option>
        <option value="PB">Paraíba</option>
        <option value="PR">Paraná</option>
        <option value="PE">Pernambuco</option>
        <option value="PI">Piauí</option>
        <option value="RJ">Rio de Janeiro</option>
        <option value="RN">Rio Grande do Norte</option>
        <option value="RS">Rio Grande do Sul</option>
        <option value="RO">Rondônia</option>
        <option value="RR">Roraima</option>
        <option value="SC">Santa Catarina</option>
        <option value="SP">São Paulo</option>
        <option value="SE">Sergipe</option>
        <option value="TO">Tocantins</option>
        <option value="EX">Estrangeiro</option>
    </select><br><br>
    <label for="pais">* País</label>
    <select id="pais" name="pais" required>
        <option value="" disabled selected>Selecione</option>
        <option value="BR">Brasil</option>
        <option value="AR">Argentina</option>
        <option value="CL">Chile</option>
        <option value="CO">Colômbia</option>
        <option value="PE">Peru</option>
        <option value="PY">Paraguai</option>
        <option value="UY">Uruguai</option>
        <option value="VE">Venezuela</option>
        <option value="BO">Bolívia</option>
        <option value="EC">Equador</option>
        <option value="PY">Paraguai</option>
    <select><br><br>
     <label for="Alan Turing">* Fale sobre Alan Turing:</label><br>
    <textarea id="mensagem" name="mensagem" rows="7" cols="40" placeholder="Digite sua mensagem"></textarea><br><br>
</center>
    
    <a href="https://www.youtube.com/watch?v=DK_0jXPuIr0">Leia os termos</a><br>
    <label for="termos">* Aceito os termos e condições</label>
    <input type="checkbox" id="termos" name="termos" required><br><br>
    <label for="newsletter">Desejo receber novidades por e-mail</label>
    <input type="checkbox" id="newsletter" name="newsletter"><br><br>
    <input type="submit" value="Enviar">
    <input type="reset" value="Limpar"><br><br>

    <a href="index.html">Clique aqui para voltar à página inicial</a>
</head>

</body>
</html>
